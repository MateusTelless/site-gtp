<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="/logo-marinho-teste.png"><title>Entrar · GETEPE</title><link rel="stylesheet" href="/admin-panel.css"><script src="/password-login.js" defer></script></head><body><main class="login-card"><img src="/logo-marinho-teste.png" alt="GETEPE"><p class="eyebrow">ADMINISTRAÇÃO DO SITE</p><h1 id="login-title">Bem-vindo ao GETEPE.</h1><p id="login-description">Entre com o usuário e a senha da equipe.</p><form id="password-login"><label>Usuário ou e-mail<input name="username" autocomplete="username" required minlength="3" maxlength="254" autocapitalize="none" spellcheck="false"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><label id="password-confirm" hidden>Confirme sua senha<input name="confirm" type="password" autocomplete="new-password" maxlength="128"></label><p id="login-feedback" role="status"></p><button class="primary" type="submit">Entrar no painel</button></form><p class="sub" id="password-help">Esqueceu a senha? Solicite um link de recuperação ao responsável pela administração do site.</p><a href="/">Voltar ao site</a></main></body></html>
